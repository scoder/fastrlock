name: Build & Publish wheel

on:
  push:
  create:

jobs:
  sdist:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - name: Install Python dependencies
      run: python -m pip install -r requirements.txt

    - name: Build sdist
      run: make sdist

    - name: Release
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/*.tar.gz

    - name: Upload sdist
      uses: actions/upload-artifact@v7
      with:
        name: sdist
        path: dist/*.tar.gz

  Linux:

    strategy:
      # Allows for matrix sub-jobs to fail without canceling the rest
      fail-fast: false

      matrix:
        image:
          - manylinux1_x86_64
          - manylinux1_i686
          - manylinux_2_24_i686
          - manylinux_2_24_x86_64
          - manylinux_2_28_x86_64
          - musllinux_1_1_x86_64
          #- manylinux_2_24_ppc64le
          #- manylinux_2_24_s390x
        pyversion: ["cp"]  # all CPython versions

        include:
          - image: manylinux_2_24_aarch64
            pyversion: "cp37"
          - image: manylinux_2_24_aarch64
            pyversion: "cp38"
          - image: manylinux_2_24_aarch64
            pyversion: "cp39"
          - image: manylinux_2_24_aarch64
            pyversion: "cp310"
          - image: manylinux_2_24_aarch64
            pyversion: "cp311"
          - image: manylinux_2_28_aarch64
            pyversion: "cp312"
          - image: manylinux_2_28_aarch64
            pyversion: "cp313"
          - image: manylinux_2_28_aarch64
            pyversion: "cp314"
          - image: manylinux_2_28_aarch64
            pyversion: "cp315"

          - image: musllinux_1_1_aarch64
            pyversion: "cp37"
          - image: musllinux_1_1_aarch64
            pyversion: "cp38"
          - image: musllinux_1_1_aarch64
            pyversion: "cp39"
          - image: musllinux_1_1_aarch64
            pyversion: "cp310"
          - image: musllinux_1_1_aarch64
            pyversion: "cp311"
          - image: musllinux_1_1_aarch64
            pyversion: "cp312"
          - image: musllinux_1_2_aarch64
            pyversion: "cp313"
          - image: musllinux_1_2_aarch64
            pyversion: "cp314"
          - image: musllinux_1_2_aarch64
            pyversion: "cp315"

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install Dependencies
      run: |
        python -m pip install -r requirements.txt

    - name: Building wheel
      run: |
        make MANYLINUX_PYTHON="${{ matrix.pyversion }}*" sdist wheel_${{ matrix.image }}

    - name: Copy wheels in dist
      run: cp -v wheelhouse*/fastrlock*.whl dist/

    - name: Release
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/*-m*linux*.whl  # manylinux / musllinux

    - name: Archive Wheels
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.image }}-${{ matrix.pyversion }}
        path: dist/  # manylinux / musllinux
        if-no-files-found: ignore

  other:

    strategy:
      # Allows for matrix sub-jobs to fail without canceling the rest
      fail-fast: false

      matrix:
        os: [macos-latest, windows-latest, windows-11-arm]
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14-dev"
        exclude:
          # No native Windows ARM64 CPython builds before 3.11.
          - os: windows-11-arm
            python-version: "3.8"
          - os: windows-11-arm
            python-version: "3.9"
          - os: windows-11-arm
            python-version: "3.10"

    runs-on: ${{ matrix.os }}

    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install -r requirements.txt

    - name: Building wheel
      run: |
        python setup.py bdist_wheel

    - name: Testing wheel
      shell: bash
      run: |
        python -m pip install pytest
        python -m pip install --no-index --find-links dist/ fastrlock
        mkdir -p "$RUNNER_TEMP/fastrlock-tests"
        cp fastrlock/tests/test_*.py "$RUNNER_TEMP/fastrlock-tests/"
        cd "$RUNNER_TEMP/fastrlock-tests"
        python -m pytest -v .

    - name: Release
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/*.whl

    - name: Archive Wheels
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.os }}-${{ matrix.python-version }}-wheels
        path: dist/*.whl
        if-no-files-found: ignore
