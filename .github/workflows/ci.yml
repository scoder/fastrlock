name: Build & Publish wheel

on:
  push:
  create:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.ref_type }}
  cancel-in-progress: true

jobs:
  sdist:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - name: Install Python dependencies
      run: python -m pip install -r requirements.txt

    - name: Build sdist
      run: make sdist

    - name: Release
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/*.tar.gz

    - name: Upload sdist
      uses: actions/upload-artifact@v7
      with:
        name: sdist
        path: dist/*.tar.gz

  Linux:

    strategy:
      # Allows for matrix sub-jobs to fail without canceling the rest
      fail-fast: false

      matrix:
        image:
          - manylinux1_x86_64
          - manylinux1_i686
          - manylinux_2_24_i686
          - manylinux_2_24_x86_64
          - manylinux_2_28_x86_64
          - manylinux_2_24_aarch64
          - manylinux_2_28_aarch64
          - musllinux_1_1_x86_64
          - musllinux_1_1_aarch64
          - musllinux_1_2_aarch64
          #- manylinux_2_24_ppc64le
          #- manylinux_2_24_s390x
        pyversion: ["cp"]  # all CPython versions

    runs-on: ${{ contains(matrix.image, '_aarch64') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install Dependencies
      run: |
        python -m pip install -r requirements.txt

    - name: Building wheel
      run: |
        make MANYLINUX_PYTHON="${{ matrix.pyversion }}*" sdist wheel_${{ matrix.image }}

    - name: Copy wheels in dist
      run: cp -v wheelhouse*/fastrlock*.whl dist/

    - name: Archive Wheels
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.image }}-${{ matrix.pyversion }}
        path: dist/  # manylinux / musllinux
        if-no-files-found: ignore

  other:

    strategy:
      # Allows for matrix sub-jobs to fail without canceling the rest
      fail-fast: false

      matrix:
        os: [macos-latest, windows-latest, windows-11-arm]
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"

        exclude:
          # No native Windows ARM64 CPython builds before 3.11.
          - os: windows-11-arm
            python-version: "3.9"
          - os: windows-11-arm
            python-version: "3.10"

    runs-on: ${{ matrix.os }}

    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install -r requirements.txt

    - name: Building wheel
      run: |
        python setup.py bdist_wheel

    - name: Archive Wheels
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.os }}-${{ matrix.python-version }}-wheels
        path: dist/*.whl
        if-no-files-found: ignore

    - name: Test wheel
      shell: bash
      run: |
        python -m pip install pytest
        python -m pip install --no-index --find-links dist/ fastrlock
        mkdir -p "$RUNNER_TEMP/fastrlock-tests"
        cp fastrlock/tests/test_*.py "$RUNNER_TEMP/fastrlock-tests/"
        cd "$RUNNER_TEMP/fastrlock-tests"
        python -m pytest -v .


  merge_wheels:
    name: Merge wheel archives
    needs: [Linux, other]
    runs-on: ubuntu-latest

    steps:
    - name: Merge wheels
      uses: actions/upload-artifact/merge@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: all_wheels
        pattern: wheels-*
        delete-merged: true
        compression-level: 9


  validate_wheels:
    name: Validate wheels
    needs: [ merge_wheels ]
    runs-on: ubuntu-latest

    steps:
      - name: Download files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: all_wheels
          path: ./dist_downloads
          merge-multiple: true

      - name: Twine-check wheels
        run: |
          python -m pip install -U twine packaging
          ERRORS=0
          for wheel in ./dist_downloads/*.whl; do twine check ${wheel} || ERRORS=$((ERRORS + 1)); done
          exit $ERRORS


  upload_release_assets:
    name: Upload packages
    needs: [ sdist, validate_wheels ]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'

    permissions:
      contents: write

    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ./dist_downloads
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la ./dist_downloads

      - name: Deduplicate wheels
        run: python3 dedup_wheels.py -d ./dist_downloads

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ./dist_downloads/*
